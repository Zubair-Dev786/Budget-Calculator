<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budget Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Header -->

        <header class="header">

            <h1>Budget Calculator</h1>

            <p>
                Manage your income and expenses in one place.
            </p>

        </header>


        <!-- Income -->

        <section class="section">

            <h2>1. Enter Your Income</h2>

            <div class="income-form">

                <input type="number" id="income" placeholder="Enter your monthly income">

                <button id="incomeBtn">
                    Set Income
                </button>

            </div>

        </section>


        <!-- Add Expense -->

        <section class="section">

            <h2>2. Add Your Expense</h2>

            <div class="expense-form">

                <input type="text" id="expenseName" placeholder="Expense name e.g. Rashan">

                <input type="number" id="expenseAmount" placeholder="Amount">

                <select id="expenseCategory">

                    <option value="">Select Category</option>

                    <option value="Groceries">
                        Groceries / Rashan
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Rent">
                        Rent
                    </option>

                    <option value="Transport">
                        Transport
                    </option>

                    <option value="Education">
                        Education / Fees
                    </option>

                    <option value="Medical">
                        Medical / Healthcare
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

                <button id="addExpenseBtn">
                    Add Expense
                </button>

            </div>

        </section>


        <!-- Expenses -->

        <section class="section">

            <h2>3. Your Expenses</h2>

            <div id="expenseList">

            </div>

        </section>


        <!-- Summary -->

        <section class="result">

            <h2>Budget Summary</h2>

            <div class="summary-row">

                <span>Total Income</span>

                <strong id="totalIncome">
                    Rs. 0
                </strong>

            </div>

            <div class="summary-row">

                <span>Total Expenses</span>

                <strong id="totalExpenses">
                    Rs. 0
                </strong>

            </div>

            <div class="summary-row">

                <span>Remaining Balance</span>

                <strong id="remainingBalance">
                    Rs. 0
                </strong>

            </div>

            <div class="summary-row">

                <span>Highest Expense</span>

                <strong id="highestExpense">
                    Rs. 0
                </strong>

            </div>

            <div class="summary-row">

                <span>Lowest Expense</span>

                <strong id="lowestExpense">
                    Rs. 0
                </strong>

            </div>

            <div class="summary-row">

                <span>Status</span>

                <strong id="budgetStatus">
                    Not Calculated
                </strong>

            </div>

        </section>


        <!-- Reset -->

        <button id="resetBtn" class="reset-btn">
            Reset All Budget
        </button>


    </main>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="script.js"></script>

</body>

</html>
